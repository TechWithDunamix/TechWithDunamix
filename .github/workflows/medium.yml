name: Update Medium Posts

on:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours
  workflow_dispatch:

permissions:
  contents: write # Allows the workflow to push changes to the repository
  id-token: write # Required for authentication with the GitHub token

jobs:
  update-readme:
    runs-on: ubuntu-latest
    name: Fetch latest Medium posts
    steps:
      - uses: actions/checkout@v3

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@techwithdunamix"
        
      - name: Set up Git user
        run: |
          git config --global user.name "Chidbele Dunamis"  # Your GitHub username
          git config --global user.email "techwithdunamix@example.com"  # Your GitHub email address

      - name: Push updates to README
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/TechWithDunamix/TechWithDunamix.git
          git add README.md
          git commit -m "Updated with the latest blog posts"
          git push origin main
